<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta name="theme-color" content="#000000" />

    <meta
      name="description"
      content="Inalgo - Autonomous AI Solutions for Enterprise. We build production-ready AI infrastructure that helps enterprises automate complex workflows, deploy intelligent agents, and turn knowledge into measurable business outcomes."
    />

    <title>Inalgo | Autonomous AI Solutions for Enterprise</title>

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://inalgo.tech/" />
    <meta property="og:title" content="Inalgo | Autonomous AI Solutions for Enterprise" />
    <meta property="og:description" content="Inalgo - Autonomous AI Solutions for Enterprise. We build production-ready AI infrastructure that helps enterprises automate complex workflows, deploy intelligent agents, and turn knowledge into measurable business outcomes." />
    <meta property="og:image" content="https://inalgo.tech/logo.png" />
    <meta property="og:site_name" content="Inalgo" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://inalgo.tech/" />
    <meta property="twitter:title" content="Inalgo | Autonomous AI Solutions for Enterprise" />
    <meta property="twitter:description" content="Inalgo - Autonomous AI Solutions for Enterprise. We build production-ready AI infrastructure that helps enterprises automate complex workflows, deploy intelligent agents, and turn knowledge into measurable business outcomes." />
    <meta property="twitter:image" content="https://inalgo.tech/logo.png" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://inalgo.tech/" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: #111111;
      }

      body {
        overflow-x: hidden;
      }

      #root {
        width: 100%;
        min-height: 100vh;
      }

      /* Perfect Circular Logo */
      .logo {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
      }

      /* Mobile */
      @media (max-width: 768px) {
        .logo {
          width: 60px;
          height: 60px;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>

    <!-- Correct script reference for Create React App -->
    <script src="/static/js/main.js" defer></script>
  </body>
</html>
